<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        rel="stylesheet">

<body>
   <header id="navbar">
  <nav class="navbar">
    <div class="container">
      <a href="#hero-slider" class="brand"><span class="brand-mark"><i class="fa-solid fa-mountain-sun"></i></span> Afghanistan Walk</a>

      <ul class="nav-links">

        <li><a href="#cars" data-i18n="nav_cars">Cars</a></li>
        <li><a href="#business-registration" data-i18n="nav_business">Business</a></li>
      </ul>

      <div class="nav-actions">
        <div class="nav-search" data-nav-search>
          <div class="nav-search-field">
            <i class="fa-solid fa-magnifying-glass"></i>

          <button class="icon-btn nav-search-icon-btn" data-search-open aria-label="Open search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <button class="btn btn-primary btn-sm login-btn" data-open-modal="login-modal"><i class="fa-solid fa-user"></i> <span data-i18n="login_btn">Login</span></button>

        <div class="user-chip" data-sidebar-toggle>
          <span class="avatar" data-user-avatar>B</span>
          <span data-user-name>Bashir</span>
          <i class="fa-solid fa-bars"></i>
        </div>

        <button class="icon-btn hamburger" id="mobile-menu-btn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </nav>

  <!-- Simple mobile nav panel -->
  <div id="mobile-menu" class="container" style="display:none;padding-bottom:16px;">
    <ul style="display:flex;flex-direction:column;gap:4px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow-soft);">

      <li><a href="parks.html" style="display:block;padding:10px 8px;font-weight:600;" data-i18n="nav_parks">Parks</a></li>
